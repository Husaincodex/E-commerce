name: E-commerce CI/CD Deployment

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    name: Build and Deploy to AWS EC2
    runs-on: ubuntu-latest

    steps:
      # 1. Download GitHub repository
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # 3. Install frontend dependencies
      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci

      # 4. Build frontend
      - name: Build Frontend
        working-directory: frontend
        run: npm run build

      # 5. Install backend dependencies and check syntax
      - name: Install Backend Dependencies
        working-directory: backend
        run: npm ci

     
      # Configure SSH using Base64 private key
      - name: Configure SSH
        env:
          EC2_SSH_KEY_B64: ${{ secrets.EC2_SSH_KEY_B64 }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          printf '%s' "$EC2_SSH_KEY_B64" | base64 --decode > ~/.ssh/ec2_deploy_key

          chmod 600 ~/.ssh/ec2_deploy_key

          ssh-keygen -y -f ~/.ssh/ec2_deploy_key > /dev/null

          echo "SSH private key validated successfully"

      # Add EC2 host
      - name: Add EC2 to Known Hosts
        run: |
          ssh-keyscan -H "${{ secrets.EC2_HOST }}" >> ~/.ssh/known_hosts


      # 7. Create deployment directories
      - name: Prepare EC2 Directories
        run: |
          ssh -i ~/.ssh/ec2_deploy_key -o IdentitiesOnly=yes \
            ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} \
            "mkdir -p /var/www/ecommerce /home/ec2-user/ecommerce-backend"

      # 8. Deploy frontend
      - name: Deploy Frontend
        run: |
          if [ -d "frontend/dist" ]; then
            BUILD_DIR="frontend/dist"
          elif [ -d "frontend/build" ]; then
            BUILD_DIR="frontend/build"
          else
            echo "Frontend build directory not found"
            exit 1
          fi

          rsync -avz --delete \
            -e "ssh -i ~/.ssh/ec2_deploy_key -o IdentitiesOnly=yes" \
            "$BUILD_DIR/" \
            ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}:/var/www/ecommerce/

      # 9. Deploy backend
      - name: Deploy Backend
        run: |
          rsync -rlvz --delete \
            --no-owner \
            --no-group \
            --no-perms \
            --omit-dir-times \
            --exclude='.env' \
            --exclude='node_modules' \
            -e "ssh -i ~/.ssh/ec2_deploy_key -o IdentitiesOnly=yes" \
            backend/ \
            ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}:ecommerce-backend/

      # 10. Install production dependencies and restart backend
      - name: Restart Backend on EC2
        run: |
          ssh -i ~/.ssh/ec2_deploy_key -o IdentitiesOnly=yes \
            ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} << 'EOF'
            set -e
            cd /home/ec2-user/ecommerce-backend
            npm ci --omit=dev

            if pm2 describe ecommerce-backend >/dev/null 2>&1; then
              pm2 restart ecommerce-backend
            else
              pm2 start npm --name ecommerce-backend -- start
            fi

            pm2 save
          EOF
      # 11. Deployment completed
      - name: Deployment Success
        run: echo "E-commerce application deployed successfully to AWS EC2"
